name: TikTok connect (one time)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Authorization code from the callback page (single use, expires in minutes)"
        required: true

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Exchange code and save encrypted token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          IN_CODE: ${{ inputs.code }}
        run: |
          echo "::add-mask::$IN_CODE"
          python scripts/tiktok_connect.py --code "$IN_CODE"
      - name: Commit token file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tiktok_token.enc
          git commit -m "Connect TikTok (encrypted token)"
          git pull --rebase -q && git push
