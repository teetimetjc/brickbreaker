name: TikTok midday draft (random names)

# Extra TikTok-only draft between the two regular posts: 2 popular names spelled in bricks (tiktok_names.py).
# GitHub cron can run late; that's fine for a draft Trevor posts by hand.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Send to TikTok drafts (false = render only)"
        type: choice
        options: ["true", "false"]
        default: "true"
  schedule:
    - cron: "23 17 * * *"   # ~11:23 am Chicago

concurrency:
  group: autopost   # shares data/tiktok_token.enc with the main workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg + Python packages
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -y && \
               timeout 180 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
              break
            fi
            echo "apt attempt $i failed; retrying in 10s"; sleep 10
          done
          pip install -r requirements.txt
      - name: Render + send draft
        env:
          AUTOPOST_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live || vars.AUTOPOST_LIVE || 'true' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python tiktok_names.py
      - name: Save token + used names
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "TikTok midday draft (run ${{ github.run_number }})"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-midday-${{ github.run_number }}
          path: output/tiktok_names/
          if-no-files-found: ignore
