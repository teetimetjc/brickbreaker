name: Relax video (weekly, long-form)

# 1-hour calm widescreen video for watch hours (relax.py). YouTube only.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Upload to YouTube (false = render only, kept as an artifact)"
        type: choice
        options: ["false", "true"]
        default: "false"
      minutes:
        description: "Length in minutes (0 = random 60/60/180 for the A/B test)"
        default: "0"
  schedule:
    - cron: "47 1 * * 2"   # Monday ~7:47 pm Chicago (people put these on at night)
    - cron: "47 1 * * 5"   # Thursday ~7:47 pm Chicago. Max 2/week: more risks looking mass-produced

concurrency:
  group: relax
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relax:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg + Python packages
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -y && \
               timeout 180 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
              break
            fi
            echo "apt attempt $i failed; retrying in 10s"; sleep 10
          done
          pip install -r requirements.txt
      - name: Render (and upload)
        env:
          AUTOPOST_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live || 'true' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IN_MINUTES: ${{ inputs.minutes || '0' }}
        run: |
          mkdir -p output
          python relax.py --minutes "$IN_MINUTES" --out output/relax.mp4
      - name: Save post log to the repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Log relax video (run ${{ github.run_number }})"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relax-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
