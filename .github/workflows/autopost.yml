name: Brick breaker autopost

on:
  schedule:
    # BACKUP only. The main timer is cron-job.org, which starts this workflow every 30 min inside the posting
    # windows (config.json post_windows) with window=auto; scripts/gate.py picks one random knock per window.
    # These GitHub crons fire late in each window (~9:52am / ~7:52pm Central) and go through the same gate,
    # so they only post if the window has no post yet. GitHub often runs schedules hours late or skips them.
    - cron: "52 15 * * *"
    - cron: "52 1 * * *"
  workflow_dispatch:  # "Run workflow" button for manual runs
    inputs:
      count:
        description: "How many videos (up to ~40 per run)"
        default: "1"
      live:
        description: "Post for real? (false = dry run)"
        default: "false"
      quote:
        description: "Quote this X post (paste its link). Leave blank for a normal post. Quote = X only, 1 video"
        default: ""
      text:
        description: "Your caption (blank = random hook)"
        default: ""
      ending:
        description: "How the video ends"
        type: choice
        options: [any, win, lose]
        default: any
      word:
        description: "Spell a word in bricks, e.g. MONDAY (blank = random shape)"
        default: ""
      style:
        description: "Video style (auto = mix of all styles)"
        type: choice
        options: [auto, normal, battle, escape, rings, drop]
        default: auto
      names:
        description: "Viewer names, comma separated (one brick video each, sent to TikTok drafts)"
        default: ""
      window:
        description: "Leave blank. cron-job.org sends 'auto' = post at a random time inside the current window"
        default: ""
      platforms:
        description: "Where to post"
        type: choice
        options: [all, x, youtube, tiktok]
        default: all

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write  # to commit data/posts.csv (the permanent post log)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # ~1-3 min per video on a free private-repo runner; enough for ~40
    steps:
      - uses: actions/checkout@v4

      - name: Random-time gate (timer runs only)
        id: gate
        if: github.event_name == 'schedule' || inputs.window != ''
        run: |
          git pull -q --ff-only origin main   # newest data/posts.csv, so a window never gets two posts
          python3 scripts/gate.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.post != 'false'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Python packages
        if: steps.gate.outputs.post != 'false'
        # Normally ~25 s. Ubuntu's package mirrors occasionally hang, so cap each try and retry.
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -y && \
               timeout 180 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
              break
            fi
            echo "apt attempt $i failed; retrying in 10s"; sleep 10
          done
          ffmpeg -version | head -1
          pip install -r requirements.txt

      - name: Random wait
        if: steps.gate.outputs.post == 'true'
        run: sleep ${{ steps.gate.outputs.sleep }}

      - name: Render and post
        if: steps.gate.outputs.post != 'false'
        env:
          # Scheduled runs POST by default. To pause posting, set repo variable AUTOPOST_LIVE=false
          # (Settings > Secrets and variables > Actions > Variables) or disable the workflow.
          AUTOPOST_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live || vars.AUTOPOST_LIVE || 'true' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          # Inputs go through env vars, never pasted into the script, so odd characters in a caption can't break it.
          IN_COUNT: ${{ inputs.count || '1' }}
          IN_QUOTE: ${{ inputs.quote }}
          IN_TEXT: ${{ inputs.text }}
          IN_ENDING: ${{ inputs.ending || 'any' }}
          IN_WORD: ${{ inputs.word }}
          IN_PLATFORMS: ${{ inputs.platforms || 'all' }}
          IN_STYLE: ${{ inputs.style || 'auto' }}
          IN_NAMES: ${{ inputs.names }}
        run: |
          python pipeline.py --count "$IN_COUNT" --quote "$IN_QUOTE" --text "$IN_TEXT" \
            --ending "$IN_ENDING" --word "$IN_WORD" --platforms "$IN_PLATFORMS" --style "$IN_STYLE" --names "$IN_NAMES"

      - name: Save post log to the repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Log posts from run ${{ github.run_number }}"
            git pull --rebase -q && git push
          fi

      - name: Keep the videos (download from the run page)
        if: always() && steps.gate.outputs.post != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: output/
          retention-days: 14
