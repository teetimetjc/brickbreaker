name: Brick breaker autopost

on:
  schedule:
    # Times are UTC. 14:07 UTC ~ 8:07am Central, 00:07 UTC ~ 6:07pm Central (standard time).
    - cron: "7 14 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:  # "Run workflow" button for manual runs
    inputs:
      count:
        description: "How many videos (up to ~40 per run)"
        default: "1"
      live:
        description: "Post for real? (false = dry run)"
        default: "false"
      quote:
        description: "Quote this X post (paste its link). Leave blank for a normal post. Quote = X only, 1 video"
        default: ""
      text:
        description: "Your caption (blank = random hook)"
        default: ""
      ending:
        description: "How the video ends"
        type: choice
        options: [any, win, lose]
        default: any
      word:
        description: "Spell a word in bricks, e.g. MONDAY (blank = random shape)"
        default: ""

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # ~1-3 min per video on a free private-repo runner; enough for ~40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Python packages
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Render and post
        env:
          # Scheduled runs go live only when the AUTOPOST_LIVE repo variable is "true".
          AUTOPOST_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live || vars.AUTOPOST_LIVE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Inputs go through env vars, never pasted into the script, so odd characters in a caption can't break it.
          IN_COUNT: ${{ inputs.count || '1' }}
          IN_QUOTE: ${{ inputs.quote }}
          IN_TEXT: ${{ inputs.text }}
          IN_ENDING: ${{ inputs.ending || 'any' }}
          IN_WORD: ${{ inputs.word }}
        run: |
          python pipeline.py --count "$IN_COUNT" --quote "$IN_QUOTE" --text "$IN_TEXT" \
            --ending "$IN_ENDING" --word "$IN_WORD"

      - name: Keep the videos (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: output/
          retention-days: 14
